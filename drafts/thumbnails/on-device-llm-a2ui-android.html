<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #15130F; }
  .card { position: relative; width: 1200px; height: 630px; padding: 64px 0 0 72px; color: #F2EFE6; }
  .brand { display: flex; align-items: center; gap: 12px; font: 500 20px 'JetBrains Mono', monospace; color: #9E998E; }
  .brand .dot { width: 14px; height: 14px; background: #7DD198; border-radius: 3px; }
  .brand b { color: #F2EFE6; font-weight: 700; }
  h1 { margin-top: 56px; width: 620px; font: 700 60px/1.08 'JetBrains Mono', monospace; letter-spacing: -0.02em; }
  .sub { margin-top: 22px; width: 520px; font: 400 26px/1.35 'Fira Sans', sans-serif; color: #B8B3A5; }
  .code { margin-top: 40px; width: 600px; padding: 18px 22px; border: 1px solid #25231D; border-radius: 8px; background: #1D1B16;
          font: 400 17px/1.7 'JetBrains Mono', monospace; color: #B8B3A5; white-space: pre; }
  .code .k { color: #F2EFE6; } .code .b { color: #7DD198; }
  .phone { position: absolute; right: 64px; top: 56px; width: 380px; height: 660px; padding: 12px 12px 0;
           border: 1px solid #3A3833; border-bottom: none; border-radius: 36px 36px 0 0; background: #1D1B16; }
  .phone img { display: block; width: 100%; border-radius: 26px 26px 0 0; }
</style></head>
<body><div class="card">
  <div class="brand"><span class="dot"></span><span><b>rafael</b>.tonholo.dev / articles</span></div>
  <h1>Generative UI on a phone</h1>
  <p class="sub">A2UI, an on-device model, and a tiny compiler in Kotlin</p>
  <div class="code"><span class="k">root</span> = Column([title, item0, item1])
<span class="k">item0</span> = CheckBox(<span class="b">$/items/0/name</span>, <span class="b">$/items/0/packed</span>)
<span class="k">item1</span> = CheckBox(<span class="b">$/items/1/name</span>, <span class="b">$/items/1/packed</span>)</div>
  <div class="phone"><img src="app.png" alt=""></div>
</div></body></html>
