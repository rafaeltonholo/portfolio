[versions]
kotlin = "2.4.10"
kobweb = "0.25.1"
kobweb-cli = "0.9.23"                    # kept in sync with the workflow env var
compose = "1.11.1"
power-assert = "2.4.10"
detekt = "2.0.0-alpha.6"
compose-rules = "0.6.8"

[libraries]
compose-html-core             = { module = "org.jetbrains.compose.html:html-core", version.ref = "compose" }
compose-runtime               = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
kobweb-core                   = { module = "com.varabyte.kobweb:kobweb-core", version.ref = "kobweb" }
kobweb-silk                   = { module = "com.varabyte.kobweb:kobweb-silk", version.ref = "kobweb" }
kobwebx-markdown              = { module = "com.varabyte.kobwebx:kobwebx-markdown", version.ref = "kobweb" }
kotlin-test                   = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
detekt-rules-ktlint-wrapper   = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }
compose-rules-detekt          = { module = "io.nlopez.compose.rules:detekt", version.ref = "compose-rules" }

[plugins]
kotlin-multiplatform  = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-power-assert   = { id = "org.jetbrains.kotlin.plugin.power-assert", version.ref = "power-assert" }
kobweb-application    = { id = "com.varabyte.kobweb.application", version.ref = "kobweb" }
kobwebx-markdown      = { id = "com.varabyte.kobwebx.markdown", version.ref = "kobweb" }
detekt                = { id = "dev.detekt", version.ref = "detekt" }
